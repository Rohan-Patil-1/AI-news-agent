name: Daily AI News Digest

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-ai-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AI News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PLANNER_MODEL: gemini-3.8-flash
          GEMINI_SOURCE_MODEL: gemini-3.8-flash
          GEMINI_COMPARISON_MODEL: gemini-3.8-flash
          GEMINI_SYNTHESIS_MODEL: gemini-3.8-flash
          GEMINI_REPORT_MODEL: gemini-3.8-flash
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python agent.py

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/ research_reports/
          git diff --cached --quiet || git commit -m "Create AI news and research reports"
          git push
